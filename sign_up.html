<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Left Branding / Home Link -->
    <header class="top_left_brand">
        <a href="home.html" class="brand_logo">ARCHIVE</a>
    </header>

    <!-- Sign Up Form Container -->
    <main class="page_wrapper">
        <div class="sign_up_container">
            <h2>Create an Account</h2>
            <p class="subtitle">Join Archive to track your reading journey.</p>

            <form id="form_sign_up">
                <label for="emailadd_form">Email Address</label>
                <input type="text" id="emailadd_form" name="emailadd_form" placeholder="you@example.com">

                <label for="pass_form">Password</label><br>
                <input type="password" id="pass_form" name="pass_form" placeholder="••••••••"><br>

                <label for="pass_confirmation">Password Confirmation</label><br>
                <input type="password" id="pass_confirmation" name="pass_confirmation" placeholder="••••••••"><br>

                <input type="submit" value="Sign Up">
            </form>

            <p class="auth_redirect">Already have an account? <a href="sign_in.html">Sign In</a></p>
        </div>
    </main>

</body>
</html>
