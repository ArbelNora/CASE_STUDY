<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top_left_brand">
        <a href="index.html" class="brand_logo">ARCHIVE LEDGER</a>
    </header>

    <!-- Sign Up Form Container -->
    <main class="page_wrapper">
        <div class="sign_up_container">
            <h2>Create an Account</h2>
            <p class="subtitle">Join Archive to track your reading journey.</p>

            <form id="signup-form">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" name="email" placeholder="you@example.com" required>

                <label for="signup-password">Password</label><br>
                <input type="password" id="signup-password" name="password" placeholder="••••••••" required><br>

                <label for="pass_confirmation">Password Confirmation</label><br>
                <input type="password" id="pass_confirmation" name="password_confirmation" placeholder="••••••••" required><br>

                <input type="submit" value="Sign Up">
            </form>

            <p class="auth_redirect">Already have an account? <a href="log_in.html">Sign In</a></p>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
