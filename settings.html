<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Layout - Settings</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <script type="module" src="settings.js"></script>
    <div class="container">

        <div class="layout-wrapper">
            <!-- Left Sidebar Navigation for Settings -->
            <aside class="sidebar">
                <h3 class="sidebar-title">Settings Menu</h3>
                
                <button class="tab-link active" onclick="switchSettingsTab(event, 'account-settings')"> Account</button>
                <button class="tab-link" onclick="switchSettingsTab(event, 'appearance-settings')"> Appearance</button>
                <button class="tab-link" onclick="switchSettingsTab(event, 'security-settings')"> Security</button>
                
                <hr class="sidebar-divider">
                
                <a href="main.html" class="back-link">← Back to Dashboard</a>
            </aside>

            <!-- Right Main Content Area -->
            <main class="main-layout">
                <div class="content-container">
                    <div class="settings-display-area">
                        
                        <!-- Account Settings Tab Content -->
                        <div id="account-settings" class="settings-tab-content" style="display: block;">
                            <h2>Account Settings</h2>
                            <p>Manage your account details and profile information.</p>

                            <div class="settings-form-group">
                                <label for="settings-username">Username</label>
                                <input type="text" id="settings-username" readonly>
                            </div>

                            <div class="settings-form-group">
                                <label for="settings-email">Email Address</label>
                                <input type="email" id="settings-email" readonly>
                            </div>

                            <button id="logout-btn">Log Out</button>
                        </div>

                        <!-- Appearance Settings Tab Content -->
                        <div id="appearance-settings" class="settings-tab-content" style="display: none;">
                            <h2>Appearance</h2>
                            <p>Customize how Archive Ledger looks on your screen.</p>

                            <div class="appearance-card">
                                <div>
                                    <h4>Theme Preference</h4>
                                    <span>Switch between dark and light mode</span>
                                </div>
                                <button id="theme-toggle-btn"> Dark Mode</button>
                            </div>
                        </div>

                        <!-- Security Settings Tab Content -->
                        <div id="security-settings" class="settings-tab-content" style="display: none;">
                            <h2>Security</h2>
                            <p>Manage your password and account security.</p>

                            <div class="security-card">
                                <button id="change-password-btn">Change Password</button>
                            </div>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
