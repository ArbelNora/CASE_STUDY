<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="sub-body">

    <header class="top_left_brand">
        <a href="index.html" class="brand_logo">ARCHIVE LEDGER</a>
    </header>

    <!-- Log In Form Container -->
    <main class="page_wrapper">
        <div class="sign_up_container">
            <h2 class="title-wrap"><strong>Welcome</strong></h2>
            <p class="subtitle">Please Log In to your account</p>

            <form id="login-form">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" name="email" placeholder="you@example.com" required>

                <label for="login-password">Password</label><br>
                <input type="password" id="login-password" name="password" placeholder="••••••••" required><br>

                <input type="submit" value="Log In">
            </form>

            <p class="auth_redirect">Don't have an account? <a href="sign_up.html">Sign Up.</a></p>
        </div>
    </main>

    <script type="module" src="script.js"></script>

    <footer>
        <p>&copy; 2026 Archive Ledger. All rights reserved.</p>
    </footer>
</body>
</html>
